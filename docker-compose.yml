services:
  libwdi-x86:
    build:
      context: ../libwdi
      dockerfile: docker/Dockerfile
    image: xpcu-libwdi-builder:bookworm
    environment:
      LIBWDI_ARCH: x86
    volumes:
      - ${LIBWDI_HOST_SRC:-../libwdi}:/src:ro
      - ${LIBWDI_HOST_DIST:-../libwdi/dist}:/out

  libwdi-x64:
    build:
      context: ../libwdi
      dockerfile: docker/Dockerfile
    image: xpcu-libwdi-builder:bookworm
    environment:
      LIBWDI_ARCH: x64
    volumes:
      - ${LIBWDI_HOST_SRC:-../libwdi}:/src:ro
      - ${LIBWDI_HOST_DIST:-../libwdi/dist}:/out

  package:
    build:
      context: .
      target: package
    image: xilinx-platform-cable-deployer:bookworm
    depends_on:
      libwdi-x86:
        condition: service_completed_successfully
      libwdi-x64:
        condition: service_completed_successfully
    volumes:
      - ${XPCU_HOST_DIST:-./dist}:/out
      - ${LIBWDI_HOST_DIST:-../libwdi/dist}:/libwdi-dist:ro
